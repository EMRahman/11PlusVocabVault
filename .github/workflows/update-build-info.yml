name: Update Build Info

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-info.js'

jobs:
  update-build-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build info
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d')
          BUILD_TIME=$(date -u '+%H:%M UTC')
          BUILD_ISO=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          BUILD_VER=$(date -u '+%Y%m%d%H%M')
          cat > build-info.js << JSEOF
          const BUILD_INFO = {
            date: '${BUILD_DATE}',
            time: '${BUILD_TIME}',
            iso: '${BUILD_ISO}'
          };
          JSEOF
          # Cache-bust the entry <script> tags in index.html. NOTE: ES module
          # import specifiers inside js/*.js are intentionally NOT stamped —
          # stamping them breaks module identity under Node (test files import the
          # unstamped paths, so a module would load twice), and the browser already
          # revalidates sub-modules via GitHub Pages' cache headers.
          sed -i "s/?v=[^\"']*/?v=${BUILD_VER}/g" index.html
          echo "BUILD_VER=${BUILD_VER}" >> "$GITHUB_ENV"

      # main requires changes via PR (repo ruleset), so this opens a PR from a
      # throwaway branch instead of pushing straight to main, then enables
      # auto-merge. The branch commit has no [skip ci] so the PR's "test" check
      # actually runs and can satisfy the required-status-check rule; [skip ci]
      # is added only to the final merge commit (--subject) so landing on main
      # doesn't re-trigger this workflow or re-run tests there.
      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- build-info.js index.html; then
            echo "No build-info changes; skipping."
            exit 0
          fi

          BRANCH="chore/update-build-info-${BUILD_VER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add build-info.js index.html
          git commit -m "chore: update build info"
          git push -u origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: update build info" \
            --body "Automated refresh of the build-info date/time banner and the \`?v=\` cache-busting stamps in index.html. Opened as a PR (instead of a direct push) because main requires changes to go through pull requests."

          gh pr merge "$BRANCH" --auto --merge --delete-branch \
            --subject "chore: update build info [skip ci]"
